required-version = ">=0.16"

target-version = "py311"
line-length = 120
indent-width = 4

# TODO: I think I am not a fan of the following anymore.
#       AP itself should only behave like a library, anyway. It doesn't. But it should.
#       Doesn't stop us from treating it like one, though.
src = ["../.."]  # to have core modules as first party imports

# TODO: don't think we'd need this if we'd check the jinja files itself or make them test-only or something
extend-exclude = ["gen/internal*.py"]  # generated by generate_code.py from gen/templates/*.jinja

[format]
quote-style = "single"

[lint]
select = [
    "ARG", # flake8-unused-arguments
    # "ASYNC", # flake8-async - TODO: try this out
    "B", # flake8-bugbear
    "C4", # flake8-comprehensions
    "E", # pycodestyle errors
    "F", # pyflakes
    "FURB", # refurb
    "G", # flake8-logging-format
    "I", # isort
    "ISC", # flake8-implicit-str-concat
    "N", # pep8-naming
    "PERF", # perflint
    "PLE", # pylint errors
    "PLR0", # pylint refactor errors
    "PTH", # flake8-use-pathlib
    "RET", # flake8-return
    "RUF100", # ruff / unused-noqa
    "SIM", # flake8-simplify
    "TC", # flake8-type-checking
    "UP", # pyupgrade
    "W", # pycodestyle warnings
]
ignore = [
    "UP015", # explicit is better than implicit, so we'd prefer to keep "r" in open() calls
]

[lint.per-file-ignores]
"options.py" = ["E501"]  # not sure if docstrings are passed 1:1 someone, so line breaks might be bad
"test/*" = ["RUF012"]  # AP convention is the `options` dict to be defined directly in the WorldTestBase

[lint.pylint]
max-returns = 8

[lint.flake8-type-checking]
# An editor might try to put stuff under `if TYPE_CHECKING:`,
# but AP actually evaluates those at runtime and then can't find the module
runtime-evaluated-base-classes = ["Options.PerGameCommonOptions"]

[lint.isort]
combine-as-imports = true
no-lines-before = ["local-folder"]
relative-imports-order = "closest-to-furthest"
