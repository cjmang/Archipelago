[project]
name = "gstla"
version = "0"  # placeholder for uv, the real version is in archipelago.json
requires-python = ">=3.13"

[dependency-groups]
dev = [
    "pyrefly>=1.4.0",
    "ruff>=0.16",
    "rust-just>=1.59.0",
]

[tool.ruff]
required-version = ">=0.16"
target-version = "py313"
line-length = 120
indent-width = 4

src = ["external/archipelago"]  # symlink, same as ARCHIPELAGO_ROOT in .env.local

extend-exclude = [
    "external",

    # TODO: don't think we'd need this if we'd check the jinja files itself or make them test-only or something
    "worlds/gstla/gen/internal*.py",  # generated by generate_code.py from gen/templates/*.jinja
]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = [
    "ARG", # flake8-unused-arguments
    # "ASYNC", # flake8-async - TODO: try this out
    "B", # flake8-bugbear
    "C4", # flake8-comprehensions
    "E", # pycodestyle errors
    "F", # pyflakes
    "FURB", # refurb
    "G", # flake8-logging-format
    "I", # isort
    "ISC", # flake8-implicit-str-concat
    "N", # pep8-naming
    "PERF", # perflint
    "PLE", # pylint errors
    "PLR0", # pylint refactor errors
    # "PTH", # flake8-use-pathlib - disabled for now, should enable once more stuff is fixed
    "RET", # flake8-return
    "RUF100", # ruff / unused-noqa
    "SIM", # flake8-simplify
    "TC", # flake8-type-checking
    "UP", # pyupgrade
    "W", # pycodestyle warnings
]
ignore = [
    "G004", # logging-f-string, the logging's just for us. We also don't have to do any translations or something.
    "UP015", # explicit is better than implicit, so we'd prefer to keep "r" in open() calls
]

[tool.ruff.lint.per-file-ignores]
"worlds/gstla/options.py" = ["E501"]  # not sure if docstrings are passed 1:1 someone, so line breaks might be bad
"worlds/gstla/test/*" = ["RUF012"]  # AP convention is the `options` dict to be defined directly in the WorldTestBase

[tool.ruff.lint.pylint]
max-returns = 8

[tool.ruff.lint.flake8-type-checking]
# An editor might try to put stuff under `if TYPE_CHECKING:`,
# but AP actually evaluates those at runtime and then can't find the module
runtime-evaluated-base-classes = ["Options.PerGameCommonOptions"]

[tool.ruff.lint.isort]
combine-as-imports = true
no-lines-before = ["local-folder"]
relative-imports-order = "closest-to-furthest"

[tool.pyrefly]
project-includes = ["worlds/gstla"]
python-version = "3.13"
python-interpreter-find-command = ["just", "--evaluate", "python"]
search-path = [".", "external/archipelago"]

[tool.uv]
required-version = ">=0.13.4"  # minimum version with emsign certs removed
exclude-newer = "5 days"  # supply chain attacks go brr
