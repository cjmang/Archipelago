name: Set up Archipelago
description: AP checkout, install requirements, install uv with our requirements, configure .env.local

inputs:
  ap-version:
    description: Archipelago git ref (tag/branch)
    required: true
  python-version:
    description: Python version for the AP checkout
    required: true

runs:
  using: composite
  steps:
    - name: Checkout AP
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: 'ArchipelagoMW/Archipelago'
        ref: ${{ inputs.ap-version }}
        path: 'archipelago'

    - name: Set up uv
      uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      with:
        enable-cache: true
        cache-suffix: ${{ inputs.python-version }}
        cache-dependency-glob: |
          gstla/uv.lock

    - name: Set up Python ${{ inputs.python-version }}
      id: setup-python
      # for main AP venv, since we cannot properly use uv there (and just doing uv venv is not helpful here)
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ inputs.python-version }}
        cache: pip
        cache-dependency-path: |
          archipelago/requirements.txt
          archipelago/ci-requirements.txt

    - name: Install AP requirements
      shell: bash
      working-directory: archipelago
      run: pip install -r requirements.txt -r ci-requirements.txt  # should match our setup guide in CONTRIBUTING.md

    - name: Write .env.local
      shell: bash
      working-directory: gstla
      run: |
        cat > .env.local <<EOT
        ARCHIPELAGO_ROOT='../archipelago'
        PYTHON='${{ steps.setup-python.outputs.python-path }}'
        SEED='1'
        LOCAL_SERVER_PORT='38281'
        EOT
